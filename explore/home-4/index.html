<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ian Kim — home 4</title>
<!-- Version 4: one theme, Ian's own. Sunlight through leaves on paper, cyanotype blue, the leaf mark. No transit, no
     radii, almost no words: the hero is only the light, fading into the page, and the work is the covers themselves. -->
<style>
@font-face { font-family: 'Geist'; src: url('../../public/fonts/Geist-Variable.woff2') format('woff2'); font-weight: 100 900; }
@font-face { font-family: 'Geist Mono'; src: url('../../public/fonts/GeistMono-Variable.woff2') format('woff2'); font-weight: 100 900; }
:root {
  --paper: #F3F2EE; --ink: #141414; --ink-2: #6A6A66; --ink-3: #A2A29D;
  --blue: #1F3A93; --side: 240px; --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--paper); color: var(--ink); font-family: Geist, system-ui, sans-serif; font-size: 14px; line-height: 1.5; letter-spacing: -0.01em; -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
.mono { font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-3); }

/* the page's light: the scenery fills the top of the whole window and fades into the paper as you go down */
.light { position: absolute; inset: 0 0 auto 0; height: 92vh; z-index: -1; overflow: hidden;
  -webkit-mask-image: linear-gradient(180deg, #000 45%, transparent); mask-image: linear-gradient(180deg, #000 45%, transparent); }
.light .scene { position: absolute; inset: -4%; background: url(img/scenery.jpg) center / cover; animation: breathe 26s ease-in-out infinite alternate; }
@keyframes breathe { from { transform: scale(1.02) translate(-1%, -1%); } to { transform: scale(1.08) translate(1%, 1%); } }
.light .sun { position: absolute; width: 900px; height: 900px; left: 0; top: 0; border-radius: 50%; pointer-events: none;
  background: radial-gradient(circle, rgb(255 228 175 / 0.55), rgb(255 228 175 / 0) 60%); mix-blend-mode: soft-light;
  transform: translate(calc(var(--x, 70vw) - 50%), calc(var(--y, 35vh) - 50%)); transition: transform 1.6s var(--ease); }

/* sidebar: the mark, the name, three links, contact */
.side { position: fixed; inset: 0 auto 0 0; width: var(--side); padding: 32px 28px; display: flex; flex-direction: column; gap: 40px; z-index: 2; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 16px; letter-spacing: -0.03em; }
.brand img { width: 20px; height: 20px; object-fit: contain; }
.nav { display: grid; gap: 6px; font-weight: 500; color: var(--ink-2); }
.nav a:hover, .nav a.on { color: var(--ink); }
.nav a.on { color: var(--blue); }
.contact { margin-top: auto; display: grid; gap: 6px; color: var(--ink-2); }
.contact a:hover { color: var(--blue); }

/* main: a quiet stretch of light first, then the covers */
.main { margin-left: var(--side); padding: 0 32px 32px 0; }
.open { height: 62vh; min-height: 420px; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 32px 24px; }
.work { display: grid; gap: 12px; }
.work .cover { overflow: hidden; aspect-ratio: 1989 / 1416; background: #ddd; }
.work .cover img { display: block; width: 100%; height: 100%; object-fit: cover; transition: transform 1.1s var(--ease); }
.work:hover .cover img { transform: scale(1.025); }
.work .cap { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
.work .cap b { font-weight: 500; font-size: 15px; }
.work .cap span { color: var(--ink-2); }
.work .cap .mono { transition: color 0.3s; }
.work:hover .cap .mono { color: var(--blue); }
.foot { display: flex; justify-content: space-between; padding: 96px 0 0; color: var(--ink-2); }

@media (max-width: 900px) {
  .side { position: static; flex-direction: row; flex-wrap: wrap; align-items: center; gap: 20px; padding: 20px; }
  .nav { grid-auto-flow: column; gap: 18px; } .contact { margin: 0 0 0 auto; grid-auto-flow: column; gap: 16px; }
  .main { margin-left: 0; padding: 0 16px 24px; } .open { height: 40vh; }
  .grid { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { .light .scene { animation: none; } }
</style>
</head>
<body>
<div class="light" id="light"><div class="scene"></div><div class="sun"></div></div>

<aside class="side">
  <a class="brand" href="#"><img src="img/mark.png" alt="">Ian Kim</a>
  <nav class="nav"><a class="on" href="#">Work</a><a href="#">About</a><a href="#">Résumé</a></nav>
  <div class="contact"><a href="#">Email</a><a href="#">LinkedIn</a><span class="mono" id="time">San Francisco</span></div>
</aside>

<main class="main">
  <!-- no words: only the light, until the work -->
  <div class="open" aria-hidden="true"></div>
  <div class="grid">
    <a class="work" href="#">
      <div class="cover"><img src="img/cover-moober.jpg" alt="Moober screens: search, detour setting, mobile search and trip details."></div>
      <div class="cap"><span><b>Moober</b>&ensp;Finding rides that were already there</span><span class="mono">2026</span></div>
    </a>
    <a class="work" href="#">
      <div class="cover"><img src="img/cover-buzzit.jpg" alt="Buzzit screens: home, a listing, an ask and an order."></div>
      <div class="cap"><span><b>Buzzit</b>&ensp;From "I want this" to "we met up"</span><span class="mono">2026</span></div>
    </a>
  </div>
  <footer class="foot"><span>Thanks for stopping by!</span><span class="mono">Ian Kim, 2026</span></footer>
</main>
<script>
// the warm light drifts toward the cursor, slowly
const light = document.getElementById('light');
addEventListener('pointermove', (e) => { light.style.setProperty('--x', `${e.clientX}px`); light.style.setProperty('--y', `${e.clientY + scrollY}px`); });
const t = document.getElementById('time');
const tick = () => { t.textContent = 'San Francisco · ' + new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', timeZone: 'America/Los_Angeles' }); };
tick(); setInterval(tick, 30000);
</script>
</body>
</html>
