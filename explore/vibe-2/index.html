<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ian Kim — vibe test 2</title>
<!-- Vibe test 2: flatter. A plain white page, sans type, and only one place with colour and depth: the work card,
     a flat field of the project's colour with a soft gradient and a trace of leaf light, holding one real piece of UI. -->
<style>
@font-face { font-family: 'Geist'; src: url('../../public/fonts/Geist-Variable.woff2') format('woff2'); font-weight: 100 900; }
@font-face { font-family: 'Geist Mono'; src: url('../../public/fonts/GeistMono-Variable.woff2') format('woff2'); font-weight: 100 900; }
:root {
  --bg: #FFFFFF;
  --ink: #141414;
  --ink-2: #6B6B6B;
  --ink-3: #A3A3A3;
  --line: #EDEDED;
  --soft: #F5F5F4;
  --blue: #1F3A93;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--ink); font-family: Geist, system-ui, sans-serif; font-size: 15px; line-height: 1.5; letter-spacing: -0.01em; -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; text-align: left; }
.wrap { width: min(1120px, 100% - 48px); margin-inline: auto; }
.mono { font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-3); }

/* nav: flat, just text */
.nav { display: flex; justify-content: space-between; align-items: center; padding-block: 28px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 500; }
.brand img { width: 20px; height: 20px; object-fit: contain; }
.nav nav { display: flex; gap: 28px; color: var(--ink-2); }
.nav nav a:hover { color: var(--ink); }

/* hero: words first. A two-tone statement like Doze's headings, a soft light behind the top right corner */
.hero { position: relative; padding-block: 120px 140px; }

.hero h1 { font-size: clamp(36px, 4.6vw, 60px); line-height: 1.06; font-weight: 500; letter-spacing: -0.045em; max-width: 17ch; }
.hero h1 span { color: var(--ink-3); }
.hero .sub { display: flex; gap: 32px; margin-top: 40px; color: var(--ink-2); flex-wrap: wrap; }
.hero .sub div { display: grid; gap: 2px; }
.hero .sub b { font-weight: 500; color: var(--ink); }

/* work: a list of projects on the left, one colour card on the right. The open project shows its line and
   a thin progress bar; the card changes colour and its one piece of UI as the projects take turns */
.work { display: grid; grid-template-columns: 0.8fr 1.2fr; gap: 56px; align-items: center; padding-bottom: 140px; }
.work h2 { font-size: 30px; font-weight: 500; letter-spacing: -0.04em; line-height: 1.1; margin-bottom: 36px; }
.list { display: grid; gap: 4px; }
.item { display: grid; gap: 6px; padding: 16px 18px; border-radius: 14px; transition: background 0.4s var(--ease); }
.item .t { display: flex; justify-content: space-between; align-items: baseline; font-weight: 500; font-size: 16px; color: var(--ink-3); transition: color 0.3s; }
.item .d { max-height: 0; overflow: hidden; opacity: 0; color: var(--ink-2); font-size: 14px; transition: max-height 0.5s var(--ease), opacity 0.4s; }
.item .bar { height: 2px; border-radius: 2px; background: var(--line); overflow: hidden; opacity: 0; }
.item .bar i { display: block; height: 100%; width: 100%; background: var(--c); transform-origin: left; transform: scaleX(0); }
.item.on { background: var(--soft); }
.item.on .t { color: var(--ink); }
.item.on .d { max-height: 80px; opacity: 1; }
.item.on .bar { opacity: 1; }
.item.on .bar i { animation: fill var(--dur, 6s) linear forwards; }
.work.paused .item.on .bar i { animation-play-state: paused; }
@keyframes fill { to { transform: scaleX(1); } }
.item .t a { font-size: 13px; color: var(--ink-2); opacity: 0; transition: opacity 0.3s; }
.item.on .t a { opacity: 1; }

.card { position: relative; aspect-ratio: 1989 / 1416; border-radius: 24px; overflow: hidden; background: var(--c1); transition: background 0.8s var(--ease); isolation: isolate; }
/* the depth: a soft lighter corner, and the leaf light from the old site, very faint, drifting */
.cover { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transform: scale(1.03); transition: opacity 0.7s var(--ease), transform 1.2s var(--ease); }
.cover.on { opacity: 1; transform: none; }
.card .label { position: absolute; z-index: 2; left: 20px; bottom: 18px; color: rgb(255 255 255 / 0.8); }

/* footer: flat, quiet */
.foot { border-top: 1px solid var(--line); padding-block: 40px 48px; display: flex; justify-content: space-between; align-items: baseline; gap: 24px; flex-wrap: wrap; }
.foot h2 { font-size: 22px; font-weight: 500; letter-spacing: -0.03em; }
.foot nav { display: flex; gap: 24px; color: var(--ink-2); }
.foot nav a:hover { color: var(--ink); }

@media (max-width: 860px) { .work { grid-template-columns: 1fr; gap: 32px; } .hero { padding-block: 72px 96px; } }
</style>
</head>
<body>
<header class="nav wrap">
  <a class="brand" href="#"><img src="img/mark.png" alt="">Ian Kim</a>
  <nav><a href="#work">Work</a><a href="#">About</a><a href="#">Résumé</a></nav>
</header>

<main class="wrap">
  <section class="hero">
    <h1>Ian Kim is a product designer <span>with an artist's eye for detail.</span></h1>
    <div class="sub">
      <div><b>Now</b><span>Designing Moober and Buzzit</span></div>
      <div><b>Studying</b><span>Design at UC Davis</span></div>
      <div><b>From</b><span>San Francisco</span></div>
    </div>
  </section>

  <section class="work" id="work">
    <div>
      <h2>Selected work</h2>
      <div class="list">
        <button class="item on" data-i="0" style="--c: #4A5CE0">
          <span class="t">Moober <a href="#">Case study &rarr;&#65038;</a></span>
          <span class="d">Search that finds the rides already passing through a rider's town.</span>
          <span class="bar"><i></i></span>
        </button>
        <button class="item" data-i="1" style="--c: #336677">
          <span class="t">Buzzit <a href="#">Case study &rarr;&#65038;</a></span>
          <span class="d">A student marketplace where completed bookings went from 22% to 92%.</span>
          <span class="bar"><i></i></span>
        </button>
      </div>
    </div>
    <div class="card" id="card" style="--c1: #4A5CE0; --c2: #8E9BF5">
      <img class="cover on" src="img/cover-moober.jpg" alt="Moober screens: search, detour setting, mobile search and trip details.">
      <img class="cover" src="img/cover-buzzit.jpg" alt="Buzzit screens: home, a listing, an ask and an order.">
    </div>
  </section>

  <footer class="foot">
    <h2>Thanks for stopping by!</h2>
    <nav><a href="#">Email</a><a href="#">LinkedIn</a><a href="#">Résumé</a></nav>
  </footer>
</main>

<script>
// the projects take turns, like a slow carousel; hovering the list pauses it, clicking picks one
const projects = [
  { c1: '#4A5CE0', c2: '#8E9BF5', label: 'Moober · Web and mobile' },
  { c1: '#336677', c2: '#6E9AA8', label: 'Buzzit · Mobile' },
];
const work = document.querySelector('.work'), items = [...document.querySelectorAll('.item')], snips = [...document.querySelectorAll('.cover')];
const card = document.getElementById('card');
let cur = 0;
const show = (i) => {
  cur = i;
  items.forEach((el, k) => { el.classList.toggle('on', k === i); const b = el.querySelector('.bar i'); b.style.animation = 'none'; b.offsetWidth; b.style.animation = ''; });
  snips.forEach((el, k) => el.classList.toggle('on', k === i));
  card.style.setProperty('--c1', projects[i].c1); card.style.setProperty('--c2', projects[i].c2);
};
items.forEach((el, k) => el.addEventListener('click', () => show(k)));
items.forEach((el) => el.querySelector('.bar i').addEventListener('animationend', () => show((cur + 1) % items.length)));
// for review: ?buzzit opens on the second project, and pauses
if (location.search.includes('buzzit')) { show(1); work.classList.add('paused'); }
work.addEventListener('pointerenter', () => work.classList.add('paused'));
work.addEventListener('pointerleave', () => work.classList.remove('paused'));
</script>
</body>
</html>
